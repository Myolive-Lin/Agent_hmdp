<style>
:root{--ink:#1e293b;--paper:#fffdf8;--line:#ded8cc;--accent:#c7442d;--nav:#18212d;--muted:#5f6d7d}*{box-sizing:border-box}body{margin:0;background:#ece9e1;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.shell{max-width:1440px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:250px 1fr}aside{padding:34px 22px;background:var(--nav);color:#edf3f8}.eyebrow{font:12px monospace;letter-spacing:.16em;color:#f0b2a3}h1{font-size:28px;letter-spacing:-.06em;line-height:1.15;margin:14px 0}.note{color:#afbdca;font-size:13px;line-height:1.7}#toc{display:grid;gap:5px;margin-top:28px}.toc{border:0;background:transparent;color:#cbd5e1;padding:10px;text-align:left;border-radius:6px;cursor:pointer;font:13px inherit}.toc:hover{background:#2a394d}.toc.active{background:var(--accent);color:white}main{padding:34px clamp(18px,4vw,60px);display:grid;place-items:center}.book{width:min(920px,100%);min-height:700px;background:var(--paper);box-shadow:0 28px 64px #3f3a302c;position:relative;overflow:hidden}.book:before{content:"";position:absolute;left:54px;top:0;bottom:0;border-left:1px solid #e5ded2}.page{min-height:700px;padding:52px 58px 85px 88px;animation:turn .3s ease}.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent)}h2{font-size:clamp(34px,5vw,52px);letter-spacing:-.07em;line-height:1.08;margin:14px 0 18px}.lead{max-width:700px;font-size:16px;line-height:1.85;color:var(--muted)}.summary{margin:20px 0 24px;padding:15px 17px;background:#fff1e9;border-left:4px solid var(--accent);font-size:15px;line-height:1.75;color:#674334}.section-label{margin:24px 0 8px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em}.code-note{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.65}.steps{margin:0;padding:0;list-style:none;counter-reset:step}.steps li{position:relative;padding:8px 0 8px 34px;border-bottom:1px solid #eee8df;color:var(--muted);font-size:14px;line-height:1.7}.steps li:before{counter-increment:step;content:counter(step);position:absolute;left:0;top:8px;width:21px;height:21px;text-align:center;border-radius:50%;background:var(--ink);color:white;font:12px/21px monospace}.knowledge{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.knowledge span{padding:5px 8px;border:1px solid #dfd8cc;border-radius:999px;background:white;color:#535f6d;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}.block{border-top:2px solid var(--ink);padding-top:10px}.block h3{font-size:14px;margin:0 0 8px}.block li{font-size:14px;color:var(--muted);line-height:1.75}.flow{margin:24px 0;padding:15px;background:#f3efe7;font-size:13px;font-weight:600;line-height:1.8}.flow span:not(:last-child):after{content:" → ";color:var(--accent);font-size:18px}pre{background:#14202d;color:#dbeafe;border-radius:6px;padding:18px;overflow:auto;font:12.5px/1.7 Consolas,monospace}.take{margin-top:22px;border-left:4px solid var(--accent);background:#fff2e9;padding:14px 16px;color:#654536;font-size:14px;line-height:1.7}.number{position:absolute;left:25px;bottom:29px;font:12px monospace;color:#999287}.actions{position:absolute;right:26px;bottom:21px;display:flex;gap:8px}.actions button{background:white;border:1px solid var(--line);padding:9px 13px;border-radius:4px;cursor:pointer}.actions button:disabled{opacity:.35;cursor:not-allowed}@keyframes turn{from{opacity:.1;transform:translateX(16px)}to{opacity:1;transform:none}}@media(max-width:800px){.shell{display:block}aside{padding:19px}.note{display:none}h1{font-size:23px}#toc{grid-template-columns:repeat(3,1fr);margin-top:14px}.toc{text-align:center;font-size:11px;padding:8px 4px}main{padding:0}.book,.page{min-height:calc(100dvh - 145px)}.page{padding:35px 23px 84px 49px}.book:before{left:28px}.grid{grid-template-columns:1fr}}

<body><div class="shell"><aside><div class="eyebrow">HANDWRITTEN HMDP</div><h1>Redis 业务<br>课程手册</h1><p class="note">业务规则、代码实现和 Redis 数据结构在同一页。点击目录或使用键盘 ← → 翻页。</p><nav id="toc"></nav></aside><main><section class="book"><article class="page" id="page"></article><div class="number" id="number"></div><div class="actions"><button id="prev">← 上一页</button><button id="next">下一页 →</button></div></section></main></div>
<script>
const L=[
['课程导览','从业务到 Redis','这套项目先定义业务约束，再选择 Redis 数据结构。每一课都用接口、持久化数据和测试形成闭环。',['学习顺序','登录身份 → 商户缓存 → 秒杀 → 博客 → Feed → Bitmap/HLL → GEO'],['复习方法','先说业务规则；再画数据流；最后对应 Controller、Service、Redis Key 和测试。'],'用户请求 → Controller → Service → MySQL / Redis / RabbitMQ → Result','src/main/java/com/hmdp/\n├── controller/  接收 HTTP 请求\n├── service/     编排业务规则\n├── entity/      映射 MySQL 表\n└── test/        验证真实基础设施','每页优先回答：数据存在哪里？为什么这样存？并发或失败由谁兜底？'],
['第 1 课','Redis Token 登录','验证码确认手机号，登录后将精简 UserDTO 写入 Redis Hash。每次请求用 Token 恢复用户到 UserHolder。',['关键 Key','login:code:{phone}：验证码 TTL；login:token:{token}：用户 Hash。'],['关键规则','验证码一次性使用；不使用 HttpSession；请求结束清理 ThreadLocal。'],'POST /user/code → Redis 验证码 → POST /user/login → Redis Hash Token → 拦截器 → UserHolder','String tokenKey = LOGIN_USER_KEY + token;\nstringRedisTemplate.opsForHash().putAll(tokenKey, userMap);\nstringRedisTemplate.expire(tokenKey, LOGIN_USER_TTL, TimeUnit.MINUTES);','Token 只是索引；登录态保存在 Redis，因此多实例服务可共享用户会话。'],
['第 2、3 课','商户缓存与防护','普通商户使用空值缓存和随机 TTL；热点商户使用逻辑过期与异步重建；BloomFilter 拦截明显不存在的 ID。',['普通商户','空值缓存防穿透；随机 TTL 分散失效；更新 DB 后删缓存。'],['热点商户','逻辑过期不阻塞读；互斥锁控制缓存重建。'], '请求店铺 ID → BloomFilter → Redis 缓存 → MySQL → 回填缓存','if (!shopBloomFilter.mightContain(id)) {\n    return Result.fail("商户不存在");\n}\nshop = cacheClient.queryWithPassThrough(...);','BloomFilter 返回 false 时一定不存在；返回 true 时仍需要查询 Redis 与 MySQL。'],
['第 4 课','秒杀订单与 RabbitMQ','秒杀接口快速校验库存和一人一单，再发送 MQ 消息。消费者异步扣库存并创建订单，削平峰值流量。',['Redis 负责','Lua 原子校验库存、一人一单标记、生成订单 ID。'],['MySQL 负责','条件扣库存、订单持久化、uk_user_voucher 最终兜底。'], '限流 → Lua 原子校验 → RabbitMQ → 消费者事务 → 扣库存 + 创建订单','rabbitTemplate.convertAndSend(EXCHANGE, ROUTING_KEY, order);\n\nupdate().setSql("stock = stock - 1")\n  .eq("voucher_id", voucherId).gt("stock", 0).update();','接口成功表示请求已进入秒杀链路，不代表订单已经写入 MySQL。'],
['第 5 课','达人探店与点赞榜','博客保存在 MySQL；Redis ZSet 保存点赞用户及点赞先后顺序；详情查询时聚合作者和当前用户点赞状态。',['ZSet 设计','member：userId；score：点赞时间戳；ZSCORE 判断是否已点赞。'],['查询聚合','补充作者昵称和头像；ORDER BY FIELD 保持 ZSet 顺序。'], '发布 Blog → tb_blog → 点赞 → blog:liked:{id} ZSet → 热榜 / 点赞榜','Double score = stringRedisTemplate.opsForZSet()\n    .score(BLOG_LIKED_KEY + blogId, userId.toString());\n// score == null：MySQL +1 后 ZADD\n// 否则：MySQL -1 后 ZREM','MySQL liked 是展示计数，ZSet 是点赞关系与时间顺序。'],
['第 6 课','关注、共同关注与 Feed','MySQL 持久化关注关系；Redis Set 查询共同关注；达人发博客后，将 blogId 推入每个粉丝的 ZSet 收件箱。',['两类 Key','follows:{userId}：关注集合；feed:{userId}：blogId 与发布时间。'],['滚动分页','maxTime 是上一页最小时间；offset 是相同时间已读数量。'], '关注 → tb_follow + follows:Set → 发博客 → feed:ZSet → 粉丝读取','Set<String> common = stringRedisTemplate.opsForSet()\n    .intersect(FOLLOW_KEY + userId, FOLLOW_KEY + targetId);\nstringRedisTemplate.opsForZSet().add(\n    FEED_KEY + fan.getUserId(), blogId, System.currentTimeMillis()\n);','推模式 Feed 在写博客时分发，换取粉丝读取关注流时的低延迟。'],
['第 7 课','Bitmap 签到与 HLL UV','签到要求精确状态，使用 Bitmap；UV 只关心近似去重人数，使用 HyperLogLog。',['Bitmap','sign:{userId}:{yyyyMM}；第 d 天 offset 为 d - 1。'],['HyperLogLog','uv:{pageId}:{yyyyMMdd}；重复 visitorId 不重复计数。'], 'POST /user/sign → SETBIT → GET /user/sign/count → BITFIELD + 位运算 → PFADD / PFCOUNT','stringRedisTemplate.opsForValue()\n    .setBit(key, dayOfMonth - 1, true);\n\nLong uv = stringRedisTemplate.opsForHyperLogLog().size(uvKey);','Bitmap 是精确记录；HyperLogLog 占用空间小但结果是近似值。'],
['第 8 课','附近商户与 Redis GEO','MySQL 保存商户详情，Redis GEO 只做位置索引。按距离拿到 ID 后回查 MySQL，并保持 Redis 排序。',['GEO 模型','shop:geo:{typeId}；member 是 shopId；Point 是经度 x、纬度 y。'],['查询规则','无坐标走 MySQL 分页；有坐标查询 5km 内商户并按距离升序。'], '预热 GEO → GEOSEARCH / radius → shopId + distance → MySQL 回查 → FIELD 保序','GeoResults<GeoLocation<String>> results =\n    stringRedisTemplate.opsForGeo().radius(\n      key, new Circle(new Point(x, y), new Distance(5000)),\n      GeoRadiusCommandArgs.newGeoRadiusArgs()\n        .includeDistance().sortAscending().limit(end));\n\nquery().in("id", shopIds).last("ORDER BY FIELD(id," + idStr + ")");','GEO 负责空间查询，MySQL 负责完整实体；Shop.distance 是返回时填充的非表字段。'],
['复盘','测试与系统收口','每个关键模块都用真实 MySQL、Redis 或 RabbitMQ 验证。最后检查约束、测试和配置，而不是继续无边界加功能。',['现有测试','Voucher、Blog、FollowFeed、UserSignUv、ShopGeoDataLoader。'],['数据库兜底','手机号、关注关系、一人一券均应有唯一索引。'], 'mvn test → 数据库唯一索引 → Redis 数据检查 → 接口回归 → README','mvn test\n\nSELECT user_id, voucher_id, COUNT(*)\nFROM tb_voucher_order\nGROUP BY user_id, voucher_id\nHAVING COUNT(*) > 1;','能运行只是开始；能通过测试并证明核心约束成立，才是完整的学习项目。']
];
const N={
  '课程导览':'代码结构按职责分层：Controller 接请求，Service 编排业务，Repository 与 Redis 保存数据，测试验证真实链路。',
  '第 1 课':'先创建 Token，再把必要的用户字段写入 Redis Hash 并设置 TTL；拦截器只根据 Token 恢复用户上下文。',
  '第 2、3 课':'先用 BloomFilter 拦截确定不存在的 ID；普通数据走穿透保护，热点数据走逻辑过期重建。',
  '第 4 课':'Lua 只负责快速、原子地判定资格；MQ 消费者在事务中完成最终扣库存和保存订单。',
  '第 5 课':'先更新 MySQL 点赞计数，成功后再同步 ZSet；读取时将 Redis 用户 ID 回查为可展示的用户资料。',
  '第 6 课':'关注操作同步更新 MySQL 与 Set；发博客后遍历粉丝，将博客 ID 及发布时间写入 Feed ZSet。',
  '第 7 课':'签到把当天对应的 bit 设为 1；连续天数从今天所在最低位开始右移统计；UV 只执行近似去重。',
  '第 8 课':'GEO 查询先返回店铺 ID 与距离，MySQL 再补齐详情；FIELD 确保回查结果仍按距离顺序展示。',
  '复盘':'测试通过后仍要查询数据库约束与业务结果，确保没有重复订单、负库存和无效关系数据。'
};
const B={
 '课程导览':['先识别请求属于读、写、异步还是统计场景。','明确 MySQL 是最终数据来源，Redis 是缓存、索引或高性能状态。','为每个关键规则准备集成测试，而不是只看接口返回成功。'],
 '第 1 课':['发送验证码前校验手机号，把验证码以短 TTL 写入 Redis。','登录时校验验证码；首次登录创建用户；随后生成随机 Token。','请求拦截器从 Redis Hash 取出用户并写入 UserHolder，业务层不再解析 Token。'],
 '第 2、3 课':['先用 BloomFilter 过滤一定不存在的商户 ID。','普通商户按 Cache Aside 查询并防止穿透和雪崩。','热点商户逻辑过期后允许旧值返回，由单线程异步重建缓存。'],
 '第 4 课':['限流先限制进入秒杀链路的请求速率。','Lua 在 Redis 内原子判断库存和一人一单，并预扣资格。','成功消息交给 RabbitMQ；消费者事务中条件扣库存并创建订单。'],
 '第 5 课':['发布博客时忽略前端作者 ID，始终使用 UserHolder 当前用户。','详情和热榜批量查询作者资料，并判断当前用户是否点赞。','点赞切换先更新 MySQL 计数，成功后同步 ZSet 的用户与时间。'],
 '第 6 课':['关注时写入 tb_follow，再同步写入 follows Set；取关反向删除。','共同关注通过两个 Set 的 SINTER 得到共同 ID，再批量查用户。','达人发布博客后，把 blogId 扇出写进每位粉丝的 Feed ZSet；读取时使用 maxTime 与 offset。'],
 '第 7 课':['签到将今天映射为本月 Bitmap 的一个 bit，重复签到仍然只是写 1。','连续签到用 BITFIELD 读到今天，再从最低位向前统计连续 1。','UV 向 HyperLogLog 加 visitorId；同一 ID 重复写入只算一个近似访客。'],
 '第 8 课':['先将带经纬度的商户按 typeId 批量预热到 shop:geo:{typeId}。','用户带坐标时在 5km 内按距离取店铺 ID 和 distance。','再从 MySQL 批量查询详情，并用 FIELD 恢复 Redis 的距离顺序。'],
 '复盘':['运行全量测试，确认各个外部依赖可以连通。','用数据库唯一索引和查询结果验证并发业务规则。','保存接口请求示例与环境说明，让项目能被他人复现。']
};
const K={
 '课程导览':['分层架构','领域规则','集成测试','数据一致性'],
 '第 1 课':['验证码 TTL','Redis Hash','Token','ThreadLocal','拦截器'],
 '第 2、3 课':['Cache Aside','BloomFilter','空值缓存','随机 TTL','逻辑过期','互斥锁'],
 '第 4 课':['令牌桶','Lua 原子性','RabbitMQ','事务','幂等','条件扣库存'],
 '第 5 课':['MyBatis Plus 分页','DTO 聚合','Redis ZSet','点赞状态','FIELD 保序','文件上传'],
 '第 6 课':['关系表','唯一索引','Redis Set','SINTER','Feed 推模式','ZSet 滚动分页'],
 '第 7 课':['Bitmap','SETBIT','BITFIELD','位运算','HyperLogLog','PFADD','PFCOUNT'],
 '第 8 课':['GEOADD','GEOSEARCH','经纬度','距离排序','分页','MySQL 保序'],
 '复盘':['回归测试','唯一索引','配置管理','可复现性','边界分析']
};
let n=0;const q=s=>document.querySelector(s),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function draw(){const x=L[n];q('#page').style.animation='none';void q('#page').offsetWidth;q('#page').style.animation='';q('#page').innerHTML=`<div class="kicker">${x[0]}</div><h2>${x[1]}</h2><div class="summary"><b>结论先行：</b>${x[7]}</div><p class="lead">${x[2]}</p><div class="section-label">一、业务逻辑：按步骤理解</div><ol class="steps">${B[x[0]].map(i=>`<li>${i}</li>`).join('')}</ol><div class="section-label">二、关键规则与数据设计</div><div class="grid"><section class="block"><h3>${x[3][0]}</h3><p>${x[3][1]}</p></section><section class="block"><h3>${x[4][0]}</h3><p>${x[4][1]}</p></section></div><div class="section-label">三、完整业务链路</div><div class="flow">${x[5].split(' → ').map(i=>`<span>${i}</span>`).join('')}</div><div class="section-label">四、核心代码</div><pre><code>${esc(x[6])}</code></pre><p class="code-note"><b>代码注释：</b>${N[x[0]]}</p><div class="section-label">五、需要掌握的知识点</div><div class="knowledge">${K[x[0]].map(i=>`<span>${i}</span>`).join('')}</div><div class="take"><b>六、本课复盘：</b>${x[7]} 复习时应能说清每个 Key、表字段或消息各自保存什么，以及它如何保证业务规则。</div>`;q('#number').textContent=String(n+1).padStart(2,'0')+' / '+String(L.length).padStart(2,'0');q('#prev').disabled=!n;q('#next').disabled=n===L.length-1;document.querySelectorAll('.toc').forEach((b,i)=>b.classList.toggle('active',i===n))}
L.forEach((x,i)=>{let b=document.createElement('button');b.className='toc';b.textContent=x[0];b.onclick=()=>{n=i;draw()};q('#toc').append(b)});q('#prev').onclick=()=>{if(n){n--;draw()}};q('#next').onclick=()=>{if(n<L.length-1){n++;draw()}};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')q('#prev').click();if(e.key==='ArrowRight')q('#next').click()});draw();
</script></body></html>
